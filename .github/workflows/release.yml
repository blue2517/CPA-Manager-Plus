name: Build Linux amd64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-amd64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/manager-server/go.mod
          cache-dependency-path: apps/manager-server/go.sum

      - name: Build embedded web UI
        run: |
          npm ci
          npm run build
          cp apps/web/dist/index.html apps/manager-server/internal/httpapi/web/management.html
          cp apps/web/dist/favicon.ico apps/manager-server/internal/httpapi/web/favicon.ico
          cp apps/web/dist/apple-touch-icon.png apps/manager-server/internal/httpapi/web/apple-touch-icon.png

      - name: Build Linux amd64 binary
        working-directory: apps/manager-server
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p ../../dist
          go build -trimpath \
            -ldflags "-s -w -X github.com/seakee/cpa-manager-plus/apps/manager-server/internal/buildinfo.Version=${VERSION} -X github.com/seakee/cpa-manager-plus/apps/manager-server/internal/buildinfo.SourceCommit=${GITHUB_SHA}" \
            -o ../../dist/cpa-manager-plus_linux_amd64 ./cmd/cpa-manager-plus

      - name: Verify binary and generate checksum
        working-directory: dist
        run: |
          ./cpa-manager-plus_linux_amd64 --version
          sha256sum cpa-manager-plus_linux_amd64 > checksums.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpa-manager-plus_linux_amd64
          path: |
            dist/cpa-manager-plus_linux_amd64
            dist/checksums.txt
          if-no-files-found: error

      - name: Publish tag build to this repository
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release create "${VERSION}" --verify-tag --draft \
              --title "${VERSION}" --notes "Linux amd64 binary with embedded web UI."
          fi
          gh release upload "${VERSION}" \
            dist/cpa-manager-plus_linux_amd64 dist/checksums.txt --clobber
          gh release edit "${VERSION}" --draft=false
